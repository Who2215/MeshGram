name: MeshGram CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle*"
      - "gradle.properties"
      - "tools/**"
      - "site/release.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle*"
      - "gradle.properties"
      - "tools/**"
      - "site/release.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and lint
        run: bash ./gradlew testDebug lintDebug --no-daemon

  release-tools:
    name: Release tooling checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile release tools
        run: python -m py_compile tools/telegram_release_publisher.py tools/telegram_bot_worker.py tools/sign_release_manifest.py
      - name: Validate release publisher without credentials
        run: python tools/telegram_release_publisher.py publish --dry-run
